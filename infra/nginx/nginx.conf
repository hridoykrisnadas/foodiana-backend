# Load balancer in front of the backend replicas.
#
# Docker's embedded DNS at 127.0.0.11 returns one A record per replica of the
# `backend` service. Resolving through a variable (rather than a static upstream
# block) means nginx re-resolves on the `valid=` interval, so replicas added or
# removed by `--scale` are picked up without a reload.

worker_processes auto;

events {
  worker_connections 2048;
}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Docker's internal DNS.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 4000;
    server_name _;

    # Cap request bodies at the same size the backend accepts.
    client_max_body_size 1m;

    location / {
      set $backend_service "backend:4000";
      proxy_pass http://$backend_service;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # The backend runs with TRUST_PROXY=true and reads the client IP from
      # these headers for rate limiting and logging.
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;

      # Retry the next replica if one is down or dies mid-request.
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
