# Backend cluster for load testing and production-shaped local runs.
#
#   docker compose up --build --scale backend=3
#
# nginx listens on :4000 and round-robins across the backend replicas, so a
# client's API base URL stays http://localhost:4000 no matter how many replicas
# are running.
#
# Scaling is purely by replica count. The API runs one process per container on
# purpose: a managed host's framework preset owns how the app starts, so keeping
# the process shape plain is what lets the same image and the same entry point run
# on Hostinger and here without special-casing either.

services:
  backend:
    build:
      context: .
    # No host port published: traffic arrives via the load balancer only. This
    # also lets --scale create more than one replica without port collisions.
    expose:
      - '4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: '3306'
      DB_USER: ${DB_USER:-foodiana}
      DB_PASSWORD: ${DB_PASSWORD:-foodiana}
      DB_NAME: ${DB_NAME:-foodiana}
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
    # Uploads must outlive the container, exactly as they must outlive a deploy
    # on Hostinger. A bind mount here would also work; the named volume keeps
    # `docker compose down` from destroying them.
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 3s
      retries: 3

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-foodiana}
      MARIADB_USER: ${DB_USER:-foodiana}
      MARIADB_PASSWORD: ${DB_PASSWORD:-foodiana}
    # utf8mb4 is not optional: the *_bn content columns hold Bengali, and a
    # latin1 default corrupts them silently rather than failing.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  uploads:
